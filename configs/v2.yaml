# v2: tuned so the dark-matter head can learn (see README, "Training notes").
# printed in the log. Training is resumable with --resume.
sim:
  npix: 64
  pixel_scale: 0.065      # arcsec/pixel
  supersample: 2
  psf_fwhm: 0.08          # arcsec
  z_lens: 0.5
  z_source: 2.0
  sky_sigma: 1.0
  gain: 4.0
  max_clumps: 0           # no source clumps: they mimic subhalo perturbations
  m_min: 1.0e+7
  m_max: 1.0e+10
  mf_slope: -1.9
  R_render: 2.0
  dm_prior:
    f_sub: [0.0, 0.05]
    log10_mhm: [6.0, 10.0]
  nuisance_prior:
    log10_amp_src: [1.0, 1.8]   # brighter arcs (deeper imaging): ~2.5x higher S/N

model:
  embed_dim: 256
  flow_layers_dm: 6
  flow_layers_macro: 8
  flow_hidden: 128
  n_bins: 8
  encoder_widths: [32, 64, 128, 256]
  tail_bound: 10.0

train:
  steps: 24000
  dm_weight: 3.0         # up-weight the dark-matter head's gradient into the encoder
  batch_size: 64
  lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup: 1000
  grad_clip: 5.0
  eval_every: 500
  n_val: 1024
  seed: 0
